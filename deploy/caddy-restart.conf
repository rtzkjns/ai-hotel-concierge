# Caddy — единственный вход снаружи: через него идут вебхуки каналов, админ-панель и
# ссылки на подтверждение брони, уже разосланные гостям. В его штатном юните
# Restart отсутствует, то есть Restart=no: упавший Caddy НЕ поднимается сам, и всё
# перечисленное умирает молча, пока кто-нибудь не заметит.
#
# Ставится так:
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/caddy-restart.conf /etc/systemd/system/caddy.service.d/restart.conf
#   sudo systemctl daemon-reload
# Проверяется так (не «должно работать», а работает):
#   sudo systemctl kill -s SIGKILL caddy && sleep 10 && systemctl is-active caddy
[Service]
Restart=always
RestartSec=5

[Unit]
# Без этого systemd сдаётся после нескольких перезапусков подряд — а сдаваться ему тут нельзя.
StartLimitIntervalSec=0
